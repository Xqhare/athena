[package]
name = "athena"
version = "2.2.0"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
aequa = { git = "https://github.com/xqhare/aequa" }
libc = "0.2.183"
nemesis = { git = "https://github.com/xqhare/nemesis" }

[features]
bit_flags = ["traits"]
byte_bit = []
checksum = []
compression = ["encoding_decoding"]
encoding_decoding = ["traits"]
process = []
rng_api = []
slot_map = []
sorting = []
system = []
traits = []
